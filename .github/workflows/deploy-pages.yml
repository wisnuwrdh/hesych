name: Deploy Pages (Direct Upload)

# Deploys via our own wrangler (>=4.33) instead of the Pages Git-build
# pipeline, which pins wrangler 3.114.17 — that old compiler miscompiles
# OpenNext >=1.19 workers (workers-sdk#14389).

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Dependency audit (fails on high/critical)
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build (OpenNext + Pages shim)
        run: npm run cf:build

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy .open-next --project-name=hesych --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
